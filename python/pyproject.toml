[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kasn"
dynamic = ["version"]
description = "Kolmogorov-Arnold Sieve Networks for nonparametric estimation and semiparametric inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sami Abdurahman" }]
keywords = ["sieve estimation", "Kolmogorov-Arnold networks", "group lasso",
            "nonparametric regression", "quantile regression", "econometrics",
            "time series"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "scikit-learn>=1.2",
  "torch>=2.3",
]

[project.optional-dependencies]
examples = ["pandas>=1.5"]
test = ["pytest>=7", "pandas>=1.5"]

[project.urls]
Repository = "https://github.com/samiabd8/kasn"
Issues = "https://github.com/samiabd8/kasn/issues"

[tool.hatch.version]
path = "src/kasn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kasn"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
